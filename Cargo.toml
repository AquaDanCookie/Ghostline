[package]
name = "ghostline"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "An independent, privacy-first Linux client for CyberGhost networks and imported VPN profiles"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31.1"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
